spring.application.name=hackathon

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/coomeva_hackathon?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=hackathon
spring.datasource.password=hackathon123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration (Base64 encoded)
